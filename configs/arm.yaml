# sopo 암 정의 — 이 레포가 다루는 바로 그 암. 코드의 일부이므로 커밋한다.
# (리더 암 없음 — 명령 소스는 웨이포인트/정책, sopo/sources.py 참조)

arm:
  port: /dev/ttyACM0        # udev 규칙 적용 시 /dev/sopo_follower
  baudrate: 1000000

# 관절 정의. 실행 스크립트(08_move_joint 등)가 이 목록으로 Joint 객체를 만든다.
# single: 모터 1개 (J4/J5/J6/J7)
# dual:   반전 장착된 모터 2개 (J2/J3). reference_id가 관절의 기준이 되며,
#         미러 모터는 K - reference_goal 로 제어된다.
# continuous: 스토퍼 없이 전선이 회전을 제한하는 관절 (J1). 시작 자세 ± range_ticks로
#             목표를 잘라낸다(오류 아님). 전선이 풀린 자세에서 프로그램을 시작할 것.
#             range_ticks는 cookbook/09_continuous_angle.py로 잰다.
joints:
  - name: J1
    type: continuous
    motor_id: 1
    range_ticks: 2000          # +-176 deg around home (silent clamp, brake zone from 158 deg). < 2048 so 'nearest 2048' never flips a turn on restart
    firmware_multiturn: true   # Phase bit4 ON + Min/Max_Position_Limit 0/0: servo counts turns itself
    home_abs: 2048             # cable-relaxed pose reads 2048 (cookbook/09 --center); home = nearest copy of it
  - name: J2
    type: dual
    ids: [10, 11]
    reference_id: 11
    K: 4005
  - name: J3
    type: dual
    ids: [15, 16]
    reference_id: 16
    K: 4100
  - name: J4
    type: continuous           # 360 deg roll, cable-limited like J1. setup: cookbook/12_continuous_setup.py --id 19 --center
    motor_id: 19
    range_ticks: 2000
    firmware_multiturn: true
    home_abs: 2048
  - name: J5
    type: single
    motor_id: 20
  - name: J6
    type: single
    motor_id: 21

safety:
  # 정격(스톨) 토크 대비 천분율. 300 = 30%. 사람 근처에서는 400을 넘기지 말 것.
  torque_limit: 300
  # 가속도 레지스터 (약 8.7deg/s^2 단위). 낮을수록 부드럽게 출발/정지.
  acceleration: 30
  # 제어 주기당 목표 위치 최대 변화량 (틱). 급격한 움직임 차단.
  max_relative_target: 80
  # 전 관절 공통 소프트 리밋 (틱, 0-4095)
  min_position: 200
  max_position: 3896
  # 관절별 소프트 리밋 오버라이드 (모터 ID: [min, max])
  position_limits: {}
  # 관절별 토크 캡 오버라이드 (모터 ID: 천분율)
  torque_limits: {}
  # 예시:
  #   position_limits: {19: [500, 3500]}
  #   torque_limits: {1: 150, 21: 150}

# 실측값은 configs/calibration.yaml에 따로 저장된다 (05_find_limits.py / 06_gravity_load.py).
# 실행 스크립트는 이 파일이 같은 폴더에 있으면 위 safety 값 위에 덮어씌워 적용한다.

rate_hz: 50

# 초기화(examples/init.py): 자가진단 후 이 자세로 이동해 대기. 비어 있으면 현재 자세 유지.
# 값은 reference 모터 틱. 연속 관절은 home_abs(2048) 기준 프레임으로 저장한다 (세션마다 바퀴 수가 달라도 같은 자세).
# 측정: 토크 OFF로 자세를 만든 뒤 python cookbook/13_capture_pose.py --config configs/arm.yaml
standby_pose: {J1: 2133, J2: 971, J3: 3141, J4: 2064, J5: 2212, J6: 2727}

