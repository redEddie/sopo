# sopo 미러 텔레오퍼레이션 설정 예시.
# 실제 암에 맞게 복사해서 수정하세요: cp configs/arm.example.yaml configs/arm.yaml

leader:
  port: /dev/ttyACM0
  baudrate: 1000000
  ids: [1, 2, 3, 4, 5, 6, 7]

follower:
  port: /dev/ttyACM1
  baudrate: 1000000
  ids: [1, 2, 3, 4, 5, 6, 7]
  # 축 방향이 리더와 반대인 팔로워 관절 ID 목록 (position -> 4095 - position)
  invert: []
  # 관절별 틱 오프셋 (팔로워 ID: 틱). 리더-팔로워 조립 각도 차이 보정용.
  offsets: {}

safety:
  # 정격(스톨) 토크 대비 천분율. 300 = 30%. 사람 근처에서는 400을 넘기지 말 것.
  torque_limit: 300
  # 가속도 레지스터 (약 8.7deg/s^2 단위). 낮을수록 부드럽게 출발/정지.
  acceleration: 30
  # 제어 주기당 목표 위치 최대 변화량 (틱). 급격한 움직임 차단.
  max_relative_target: 80
  # 전 관절 공통 소프트 리밋 (틱, 0-4095)
  min_position: 200
  max_position: 3896
  # 관절별 소프트 리밋 오버라이드 (팔로워 ID: [min, max])
  position_limits: {}
  # 관절별 토크 캡 오버라이드 (팔로워 ID: 천분율)
  torque_limits: {}
  # 예시:
  #   position_limits: {1: [500, 3500]}
  #   torque_limits: {1: 450, 21: 150}

# 실측값은 configs/calibration.yaml에 따로 저장된다 (05_find_limits.py / 06_gravity_load.py).
# mirror.py는 이 파일이 같은 폴더에 있으면 위 safety 값 위에 덮어씌워 적용한다.

rate_hz: 50
