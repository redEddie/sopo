# sopo 미러 텔레오퍼레이션 설정 예시.
# 실제 암에 맞게 복사해서 수정하세요: cp configs/arm.example.yaml configs/arm.yaml

leader:
  port: /dev/ttyACM0
  baudrate: 1000000

follower:
  port: /dev/ttyACM1
  baudrate: 1000000
  # 축 방향이 리더와 반대인 팔로워 관절 이름 목록 (position -> 4095 - position)
  invert: []
  # 관절별 틱 오프셋 (관절 이름: 틱). 리더-팔로워 조립 각도 차이 보정용.
  offsets: {}

# 관절 정의. mirror.py는 이 목록을 읽어 리더/팔로워 각각의 Joint 객체를 만든다.
# single: 모터 1개 (J4/J5/J6/J7)
# dual:   반전 장착된 모터 2개 (J2/J3). reference_id가 관절의 기준이 되며,
#         미러 모터는 K - reference_goal 로 제어된다.
# continuous: 스토퍼 없이 전선이 회전을 제한하는 관절 (J1). 시작 자세 ± range_ticks로
#             목표를 잘라낸다(오류 아님). 전선이 풀린 자세에서 프로그램을 시작할 것.
#             range_ticks는 cookbook/09_continuous_angle.py로 잰다.
joints:
  - name: J1
    type: continuous
    motor_id: 1
    range_ticks: 2600   # ±228°, 총 456° — 09로 실측한 값으로 교체
  - name: J2
    type: dual
    ids: [10, 11]
    reference_id: 11
    K: 4005
  - name: J3
    type: dual
    ids: [15, 16]
    reference_id: 16
    K: 4100
  - name: J4
    type: single
    motor_id: 19
  - name: J5
    type: single
    motor_id: 20
  - name: J6
    type: single
    motor_id: 21

safety:
  # 정격(스톨) 토크 대비 천분율. 300 = 30%. 사람 근처에서는 400을 넘기지 말 것.
  torque_limit: 300
  # 가속도 레지스터 (약 8.7deg/s^2 단위). 낮을수록 부드럽게 출발/정지.
  acceleration: 30
  # 제어 주기당 목표 위치 최대 변화량 (틱). 급격한 움직임 차단.
  max_relative_target: 80
  # 전 관절 공통 소프트 리밋 (틱, 0-4095)
  min_position: 200
  max_position: 3896
  # 관절별 소프트 리밋 오버라이드 (모터 ID: [min, max])
  position_limits: {}
  # 관절별 토크 캡 오버라이드 (모터 ID: 천분율)
  torque_limits: {}
  # 예시:
  #   position_limits: {19: [500, 3500]}
  #   torque_limits: {1: 150, 21: 150}

# 실측값은 configs/calibration.yaml에 따로 저장된다 (05_find_limits.py / 06_gravity_load.py).
# mirror.py는 이 파일이 같은 폴더에 있으면 위 safety 값 위에 덮어씌워 적용한다.

rate_hz: 50
