# 링크별 질량 [kg] — postprocess.py가 읽어 COM/관성텐서를 계산해 URDF에 주입한다.
#
# 두 가지 형식:
#   1) 총질량만:        link_1: 0.42      → COM/관성은 메시 균일밀도로 추정
#   2) 파트별/모터 분리 (재질이 섞인 링크에서 정확 — 카본 파이프와 출력물을 따로 잰다):
#     link_2:
#       parts:                        # 키는 메시(STL) 이름. 각 파트를 저울로 측정
#         link_2_1: 0.12              #   PETG 모터 브라켓
#         link_2: 0.23                #   카본 파이프
#       motors:                       # 모터는 스펙시트 무게 + CAD에서 읽은 위치(링크 프레임)
#         - {mass: 0.0745, xyz: [0.01, 0.05, 0.02]}   # STS3250
#     (parts 대신 shell: <kg>로 쉘 전체를 한 번에 적는 것도 가능)
#
# 모터 무게 스펙: SM8512BL 0.215kg / STS3250 0.0745kg / STS3215 ~0.06kg
# null이면 질량 플레이스홀더(1e-9)가 유지된다. 베이스는 월드에 고정이라 역학에 영향 없음.
#
# 주의: 중력보상(G(q))은 질량과 COM으로만 결정되고, 그중에서도 회전축에 수직인
# COM 성분만 중요하다. 축 방향 성분의 오차는 결과에 영향이 없다.

# TODO: 실물 저울 측정으로 교체
